workshop_name: "Workshop 1 - RLS"
response_file: "W1_ans.xlsx"
response_column: "QSScore"   # column with the correct answers
id_column: "id"
user_column: "Email"
prediction_column: "Respostes"     # column with the students' predictions
results_path: "./AdD/"
resultats_rdata: "W1.RData"
task_type: "regression"    # regression | classification
cooldown_seconds: 20           # minimum time between attempts (same browser)
poll_ms: 2500                  # benchmark refresh frequency (ms)
consolidate_after_idle_minutes: 10   # auto-consolidate after this many
                                     # minutes without any new submission
evidence_min_chars: 30         # minimum length of pasted model output for an
                               # attempt to be flagged has_evidence = TRUE
# Optional: metric  -> which metric defines the "Best" attempt in the
# classification chart. Defaults to F1-Score; not used in regression.
# Valid values: Accuracy | Precision | Sensitivity | Specificity | F1-Score
